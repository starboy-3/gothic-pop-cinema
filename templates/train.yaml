job: extension
config:
  name: klein-style-template
  process:
    - type: diffusion_trainer
      training_folder: output
      device: cuda:0
      network:
        type: lora
        linear: 32
        linear_alpha: 32
      save:
        dtype: bf16
        save_every: 250
        max_step_saves_to_keep: 10
      datasets:
        - folder_path: data/style
          caption_ext: txt
          resolution: [1024]
      train:
        batch_size: 1
        steps: 2000
        lr: 1e-4
        optimizer: adamw
        dtype: bf16
      model:
        name_or_path: black-forest-labs/flux-3-image-klein-base
        arch: flux3
      sample:
        neg: ""
        sample_every: 250
        width: 1024
        height: 1024
        guidance_scale: 3.5
        sample_steps: 50
        prompts:
          - "A lighthouse on a rocky cliff above a stormy sea at night. zqvr style"
          - "A woman cycling through a city street in the rain. zqvr style"
